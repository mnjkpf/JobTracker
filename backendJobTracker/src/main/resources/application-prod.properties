server.port=${PORT:8080}

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
# minimum-idle=0 + keepalive-time=0: пул не тримає жодного простою-конекшена і не
# пінгує БД, тому Neon може scale-to-zero при нульовому навантаженні. З
# minimum-idle=1 compute горів 24/7 і випалював CU-hours квоту.
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.keepalive-time=0

spring.data.redis.url=${REDIS_URL}

spring.docker.compose.enabled=false

# JavaMailSender is a required constructor dependency of EmailService — without
# spring.mail.host set, MailSenderAutoConfiguration skips the bean and startup fails.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}

spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}
spring.ai.anthropic.chat.options.model=claude-haiku-4-5
spring.ai.anthropic.chat.options.temperature=0.3
spring.ai.anthropic.chat.options.max-tokens=4096
spring.ai.openai.api-key=${OPENAI_API_KEY}

# Same as application-dev.properties — Flyway owns the schema, not Spring AI
spring.ai.vectorstore.pgvector.initialize-schema=false
spring.ai.vectorstore.pgvector.dimensions=1536
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.index-type=HNSW

jobtracker.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# Railway healthcheck пінгує /actuator/health кожні кілька секунд. З увімкненими
# db/redis індикаторами кожен пінг відкривав конекшн до Neon і Upstash, не даючи
# їм заснути — це зводило нанівець scale-to-zero вище.
management.health.db.enabled=false
management.health.redis.enabled=false

logging.level.com.jobtracker=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=WARN
