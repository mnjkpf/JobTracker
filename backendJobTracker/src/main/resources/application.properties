
# =====================================================
# Місце: backendJobTracker/src/main/resources/application.properties
# =====================================================
# Спільна конфігурація для всіх профілів.
# Профіль-специфічні override'и в application-{profile}.properties

# === Application name ===
spring.application.name=backendJobTracker

# === Profile activation ===
# Береться з env var SPRING_PROFILES_ACTIVE, default 'dev'
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# === JPA / Hibernate ===
# Flyway керує схемою, Hibernate тільки валідує
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
# Lazy loading в controller'ах = anti-pattern (N+1, transaction issues)
spring.jpa.open-in-view=false

# === Spring Data store disambiguation ===
# Redis використовується ЛИШЕ для кешу (StringRedisTemplate), жодних @RedisHash
# репозиторіїв нема. Без цього Spring Data Redis намагається "claim" JPA-репозиторії
# (WARN "Could not safely identify store assignment") → нестабільний старт, коли
# бін репозиторію (напр. RefreshTokenRepository) не створюється. Вимикаємо скан.
spring.data.redis.repositories.enabled=false

# === Flyway ===
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# === Jackson (JSON serialization) ===
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.indent-output=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=UTC
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSSXXX

# === Mail (загальні налаштування; SMTP host у профілі) ===
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.from=noreply@jobtracker.local

# === HTTP Server ===
server.port=8080
server.shutdown=graceful
# Не світимо внутрішніми деталями в response — повертаємо ProblemDetail
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.forward-headers-strategy=framework
server.compression.enabled=true
server.compression.mime-types=application/json,application/problem+json,text/html,text/plain
server.compression.min-response-size=1024

# === Actuator ===
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=when_authorized
management.endpoint.health.show-components=when_authorized
management.endpoint.health.probes.enabled=true
management.health.redis.enabled=true
# SMTP health-check шумить, вимикаємо
management.health.mail.enabled=false
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99
management.metrics.tags.application=${spring.application.name}
management.prometheus.metrics.export.enabled=true

# === OpenAPI / Swagger ===
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.displayRequestDuration=true
springdoc.show-actuator=false
springdoc.packages-to-scan=com.jobtracker.backendJobTracker

# === Application-specific config (custom namespace) ===
jobtracker.auth.access-token-ttl=PT15M
jobtracker.auth.refresh-token-ttl=P30D
jobtracker.auth.issuer=jobtracker
# JWT secret береться з env. У dev profile є default, у prod ОБОВ'ЯЗКОВО має бути.
jobtracker.auth.jwt-secret=${JWT_SECRET:}

jobtracker.rate-limit.default-capacity=100
jobtracker.rate-limit.default-refill-period=PT1H
jobtracker.rate-limit.auth-endpoints-capacity=10
jobtracker.rate-limit.auth-endpoints-refill-period=PT15M

jobtracker.ai.cache-ttl=P7D
jobtracker.ai.embedding-model=text-embedding-3-small
jobtracker.ai.embedding-dimension=1536

# ─── Semantic similarity thresholds (text-embedding-3-small) ───
# Винесено з коду — тюнінг без recompile. Абсолютні cosine-similarity у цієї
# моделі низькі, тому пороги менші за "інтуїтивні".
# RAG retrieval (interview notes matched для нового prep). Виміряно емпірично:
# споріднений Java query→note ~0.27–0.38, неспоріднений (React) ~0.15–0.24.
jobtracker.similarity.rag-threshold=0.30
jobtracker.similarity.rag-max-results=10
# Gap analysis (required job skills matched проти CV skills). Скіли — короткі
# рядки, схожість вища, тому поріг більший. Емпіричне значення з W3-W4.
jobtracker.similarity.gap-threshold=0.75

# CORS allowed-origins — перевизначається в профілі
jobtracker.cors.allowed-origins=

# === Logging (рівні; конкретика в logback-spring.xml) ===
logging.level.root=INFO
logging.level.com.jobtracker=DEBUG
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO

# === Spring AI model selection ===
# Обидва starters (anthropic + openai) у POM автоконфігурують ChatModel.
# Явно кажемо Spring AI брати Anthropic для ChatClient (chat/generation),
# щоб уникнути "expected single matching bean but found 2" для ChatModel.
# Embeddings лишаються на OpenAI через окремий EmbeddingModel — конфлікту немає.
spring.ai.model.chat=anthropic

spring.ai.openai.api-key=${OPENAI_API_KEY:not-set}
spring.ai.openai.embedding.options.model=text-embedding-3-small
spring.ai.openai.embedding.options.dimensions=1536