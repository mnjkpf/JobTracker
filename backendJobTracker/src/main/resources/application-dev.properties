# =====================================================
# Місце: backendJobTracker/src/main/resources/application-dev.properties
# =====================================================
# Профіль для локальної розробки.
# Активується через SPRING_PROFILES_ACTIVE=dev або є default'ом.

# === Docker Compose integration ===
# Контейнери піднімаємо вручну (docker compose up -d), тому вимикаємо
# lifecycle-інтеграцію Spring Boot — інакше JVM на старті викликає `docker`
# CLI і падає, якщо daemon тимчасово недоступний.
spring.docker.compose.enabled=false

# === PostgreSQL ===
# Порт 5440 (не 5432) — обхід конфлікту з CS2 проектом
spring.datasource.url=jdbc:postgresql://localhost:5440/jobtracker
spring.datasource.username=jobtracker
spring.datasource.password=jobtracker_dev_password
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=JobTrackerHikariCP

# === Redis ===
# Порт 6380 (не 6379) — обхід конфлікту з CS2 проектом
spring.data.redis.host=localhost
spring.data.redis.port=6380
spring.data.redis.timeout=2s
spring.data.redis.lettuce.pool.enabled=true
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0

# === JPA dev override ===
# Надто шумно; для конкретного debug'у — logging.level.org.hibernate.SQL=DEBUG
spring.jpa.show-sql=false

# === Mail (Mailpit з docker-compose) ===
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# === Spring AI ===
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:not-set}
# Дешева модель для dev / extraction
spring.ai.anthropic.chat.options.model=claude-haiku-4-5
spring.ai.anthropic.chat.options.temperature=0.3
spring.ai.anthropic.chat.options.max-tokens=4096

spring.ai.openai.api-key=${OPENAI_API_KEY:not-set}
spring.ai.openai.embedding.options.model=text-embedding-3-small
spring.ai.openai.embedding.options.dimensions=1536

# Flyway керує схемою, не Spring AI
spring.ai.vectorstore.pgvector.initialize-schema=false
spring.ai.vectorstore.pgvector.dimensions=1536
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.index-type=HNSW

# === DevTools ===
spring.devtools.restart.enabled=true
spring.devtools.restart.additional-paths=src/main/java
spring.devtools.livereload.enabled=true

# === Application config — dev override ===
# У dev — нестрашний default. У prod ОБОВ'ЯЗКОВО з env, інакше startup fails.
# ВАЖЛИВО: JwtService декодує цей secret через Base64 (Decoders.BASE64.decode),
# тому значення МАЄ бути валідним Base64, що розкодовується у >=32 байти (HS256).
# Це base64("jobtracker-development-jwt-secret-hs256-min-256-bits-2026-ok!!") = 62 байти.
jobtracker.auth.jwt-secret=am9idHJhY2tlci1kZXZlbG9wbWVudC1qd3Qtc2VjcmV0LWhzMjU2LW1pbi0yNTYtYml0cy0yMDI2LW9rISE=

# CORS для frontend на localhost
jobtracker.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# === Logging ===
logging.level.com.jobtracker=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
# Розкоментуй коли треба бачити SQL:
# logging.level.org.hibernate.SQL=DEBUG
# logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.springframework.ai=INFO