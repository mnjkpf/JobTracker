# =====================================================
# Місце: backendJobTracker/src/test/resources/application-test.properties
# =====================================================
# Профіль для інтеграційних тестів (@ActiveProfiles("test")).
# Datasource і Redis підіймаються через Testcontainers (@ServiceConnection),
# тому жодних spring.datasource.* / spring.data.redis.* тут немає —
# Spring Boot отримує їх з контейнерів автоматично.

# === JPA / Hibernate ===
# Flyway керує схемою, Hibernate лише валідує.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# === Flyway ===
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Дозволяємо clean між класами тестів за потреби.
spring.flyway.clean-disabled=false

# === Mail (Mailpit/мок у тестах — реально нічого не шлемо) ===
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# === Spring AI (тести не б'ють реальний LLM; ключі-заглушки щоб контекст піднявся) ===
spring.ai.anthropic.api-key=test-key-not-used
spring.ai.openai.api-key=test-key-not-used
spring.ai.vectorstore.pgvector.initialize-schema=false
spring.ai.vectorstore.pgvector.dimensions=1536

# === Application config — короткі TTL для тестів expiration ===
jobtracker.auth.access-token-ttl=PT5M
jobtracker.auth.refresh-token-ttl=PT1H
jobtracker.auth.issuer=jobtracker
# Валідний Base64 секрет (декодується у >= 32 байти для HS256).
jobtracker.auth.jwt-secret=dGVzdC1zZWNyZXQtZm9yLWp3dC1pbnRlZ3JhdGlvbi10ZXN0cy1taW4tMzItYnl0ZXMtbG9uZw==

# Rate-limit практично вимкнено у тестах.
jobtracker.rate-limit.default-capacity=100000
jobtracker.rate-limit.default-refill-period=PT1H
jobtracker.rate-limit.auth-endpoints-capacity=100000
jobtracker.rate-limit.auth-endpoints-refill-period=PT15M

jobtracker.ai.cache-ttl=P7D
jobtracker.ai.embedding-model=text-embedding-3-small
jobtracker.ai.embedding-dimension=1536

jobtracker.cors.allowed-origins=http://localhost:3000

# === Logging ===
logging.level.root=WARN
logging.level.com.jobtracker=INFO
logging.level.org.springframework.test=INFO
logging.level.org.testcontainers=INFO
logging.level.com.github.dockerjava=WARN
