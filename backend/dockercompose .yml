# =====================================================
# Місце: <repo-root>/docker-compose.yml
# =====================================================
# Інфраструктура для локальної розробки.
# Spring Boot starter `spring-boot-docker-compose` автоматично
# підніме ці сервіси при запуску `./mvnw spring-boot:run`.
# Або підніми вручну: `docker compose up -d`.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: jobtracker-postgres
    environment:
      POSTGRES_USER: jobtracker
      POSTGRES_PASSWORD: jobtracker_dev_password
      POSTGRES_DB: jobtracker
      # Налаштування для кращої dev-продуктивності (не для prod)
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobtracker -d jobtracker"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    labels:
      # Spring Boot Docker Compose support використовує labels
      # щоб мапити контейнер на Spring Boot connection
      org.springframework.boot.service-connection: postgres

  redis:
    image: redis:7-alpine
    container_name: jobtracker-redis
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - "256mb"
      - --maxmemory-policy
      - "allkeys-lru"
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    labels:
      org.springframework.boot.service-connection: redis

  mailpit:
    image: axllent/mailpit:latest
    container_name: jobtracker-mailpit
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    volumes:
      - mailpit_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
    name: jobtracker_postgres_data
  redis_data:
    name: jobtracker_redis_data
  mailpit_data:
    name: jobtracker_mailpit_data