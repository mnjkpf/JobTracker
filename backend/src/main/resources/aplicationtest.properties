# =====================================================
# Місце: backend/src/main/resources/application-test.properties
# =====================================================
# Профіль для інтеграційних тестів.
# Datasource і Redis підіймаються через Testcontainers
# у тестовій конфігурації (@ServiceConnection).

# === JPA ===
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# === Flyway ===
spring.flyway.enabled=true
# Дозволяємо clean у тестах між класами якщо потрібно
spring.flyway.clean-disabled=false

# === Mail (mock у тестах, не використовується по-справжньому) ===
spring.mail.host=localhost
spring.mail.port=1025

# === Spring AI (тести мокають LLM, але config має бути валідний) ===
spring.ai.anthropic.api-key=test-key-not-used
spring.ai.openai.api-key=test-key-not-used
spring.ai.vectorstore.pgvector.initialize-schema=false
spring.ai.vectorstore.pgvector.dimensions=1536

# === Application config — швидкі TTL для тестування expiration ===
jobtracker.auth.access-token-ttl=PT5M
jobtracker.auth.refresh-token-ttl=PT1H
jobtracker.auth.jwt-secret=test-secret-CHANGE-ME-min-256-bits-long-only-for-testing-context-12345

# Практично disabled у тестах
jobtracker.rate-limit.default-capacity=1000
jobtracker.rate-limit.default-refill-period=PT1H

# === Logging ===
logging.level.root=WARN
logging.level.com.jobtracker=DEBUG
logging.level.org.springframework.test=INFO
logging.level.org.testcontainers=INFO
logging.level.com.github.dockerjava=WARN